<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>꼬마 바리스타 카페</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 레이아웃: 16:9 무대 하나. 심사위원 장면과 바(제조대) 장면을 옆으로 밀어 바꾸고, 안내판·말풍선·계기판은 그 위에 얹는다. */
:root{
  --ink:#4a2c22; --paper:#fff7ea; --coral:#ff8a73; --coral-d:#e2634d; --mint:#d5e7d6;
  --butter:#f6c667; --leaf:#5fb57f; --night:#2e211d; --muted:#8a5a44;
  --red:#e8584a; --g1:#9fdc8c; --g2:#2f9e5b; --yel:#f3c64c;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font);box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#tip{display:none;margin:0;color:var(--paper);font-size:15px;text-align:center}
@media (orientation:portrait) and (max-width:620px){#tip{display:block}}

#stage{--u:8px;position:relative;width:800px;height:450px;max-width:100%;overflow:hidden;background:var(--mint);
  border-radius:calc(var(--u)*1.2);touch-action:none}
.layer{position:absolute;inset:0;transition:transform .85s cubic-bezier(.7,0,.2,1)}
.layer>svg{display:block;width:100%;height:100%}
#Lbar{transform:translateX(101%)}
#stage.st #Ljudge{transform:translateX(-100%)}
#stage.st #Lbar{transform:translateX(0)}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(0,5px)}60%{transform:translate(0,-2px)}}
#station.shake{animation:shake .22s ease-out}
@keyframes bow{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(2.5%) scale(1.03)}}
#judge.bow{animation:bow 1.1s ease-in-out;transform-origin:50% 100%}

/* 그림 공통 */
svg .o{stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
svg .o4{stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
svg .o3{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg .nf{fill:none}
svg .np{pointer-events:none}
svg .hit{cursor:pointer}
svg text{font-family:var(--font)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:translateY(8px) rotate(2deg)}60%{transform:translateY(0) rotate(-1deg)}}
.nod{animation:nod .7s ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pick{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pickme{animation:pick .9s ease-in-out infinite}
@keyframes zoned{to{stroke-dashoffset:-48}}
.zone{fill:rgba(255,138,115,.16);stroke:var(--coral);stroke-width:5;stroke-dasharray:14 10;stroke-linecap:round;animation:zoned 1.1s linear infinite;pointer-events:none}
.zone.near{fill:rgba(95,181,127,.32);stroke:#3c9a63}
.ghost{fill:rgba(255,255,255,.35);stroke:var(--coral);stroke-width:4;stroke-dasharray:12 9;animation:zoned 1.1s linear infinite}
.ghost.done{display:none}
@keyframes dripA{to{stroke-dashoffset:-44}}
.drip{stroke-dasharray:16 28;animation:dripA .65s linear infinite}
@keyframes ringp{0%,100%{opacity:1}50%{opacity:.35}}
.ringp{animation:ringp .9s ease-in-out infinite}

/* 위에 얹는 안내 */
#hud{position:absolute;left:calc(var(--u)*1.6);top:calc(var(--u)*1.4);display:flex;gap:calc(var(--u)*1);align-items:center;z-index:5}
.pill{display:flex;align-items:center;gap:calc(var(--u)*.6);background:var(--paper);border:calc(var(--u)*.4) solid var(--ink);
  border-radius:calc(var(--u)*3);padding:calc(var(--u)*.35) calc(var(--u)*1.5);font-size:calc(var(--u)*2.6);line-height:1.2;
  box-shadow:0 calc(var(--u)*.45) 0 rgba(74,44,34,.25);white-space:nowrap}
.pill b{font-weight:400;color:var(--coral-d)}
.pill .over{color:var(--red)}
#snd,#home{flex:none;width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);
  border-radius:50%;background:var(--paper);border:calc(var(--u)*.4) solid var(--ink);padding:calc(var(--u)*.9);cursor:pointer;
  box-shadow:0 calc(var(--u)*.45) 0 rgba(74,44,34,.25)}
#snd svg,#home svg{width:100%;height:100%;display:block}

#gauge{position:absolute;left:2%;width:25%;top:15%;box-sizing:border-box;z-index:5;background:var(--paper);border:calc(var(--u)*.4) solid var(--ink);
  border-radius:calc(var(--u)*2);padding:calc(var(--u)*.7) calc(var(--u)*1.4) calc(var(--u)*.5);box-shadow:0 calc(var(--u)*.45) 0 rgba(74,44,34,.25);
  transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .25s}
#gauge.off{transform:translateX(-130%);opacity:0;pointer-events:none}
#gcap{font-size:calc(var(--u)*2);color:var(--muted);line-height:1.1}
#gtop{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*.8);font-size:calc(var(--u)*2.4);line-height:1.15}
#gsec{font-size:calc(var(--u)*3.4);font-variant-numeric:tabular-nums;white-space:nowrap}
#glabel{white-space:nowrap;font-size:calc(var(--u)*2.2);padding:calc(var(--u)*.15) calc(var(--u)*1.1);border-radius:calc(var(--u)*1.4);color:#fff;background:var(--muted)}
#gbar{position:relative;display:flex;height:calc(var(--u)*2.6);margin-top:calc(var(--u)*.5);border:calc(var(--u)*.3) solid var(--ink);border-radius:calc(var(--u)*1.3);overflow:hidden}
#gbar i{display:block;height:100%}
#gmark{position:absolute;top:-30%;bottom:-30%;width:calc(var(--u)*.7);margin-left:calc(var(--u)*-.35);background:#fff;border:calc(var(--u)*.25) solid var(--ink);border-radius:calc(var(--u)*.4);left:0}
#gnum{position:relative;height:calc(var(--u)*2.2);font-size:calc(var(--u)*1.7);color:var(--muted)}
#gnum span{position:absolute;transform:translateX(-50%)}

#bubble{position:absolute;left:30%;right:30%;top:4%;background:#fff;border:calc(var(--u)*.45) solid var(--ink);
  border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.1) calc(var(--u)*2.2) calc(var(--u)*1.5);font-size:calc(var(--u)*3.3);
  line-height:1.3;text-align:center;word-break:keep-all;text-wrap:balance;z-index:5;box-shadow:0 calc(var(--u)*.6) 0 rgba(74,44,34,.2);
  transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s}
#bubble.off{transform:scale(.6);opacity:0;pointer-events:none}
#bname{position:absolute;left:calc(var(--u)*2);top:calc(var(--u)*-1.9);background:var(--butter);border:calc(var(--u)*.4) solid var(--ink);
  border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*.1) calc(var(--u)*1.5);font-size:calc(var(--u)*2.2)}
.stars{display:flex;justify-content:center;gap:calc(var(--u)*.4)}
.stars svg{width:calc(var(--u)*5);height:calc(var(--u)*5)}

#panel{position:absolute;left:3%;right:3%;bottom:3.5%;min-height:17%;box-sizing:border-box;display:flex;align-items:center;
  gap:calc(var(--u)*2);background:var(--paper);border:calc(var(--u)*.45) solid var(--ink);border-radius:calc(var(--u)*2.6);
  padding:calc(var(--u)*1.4) calc(var(--u)*2.4) calc(var(--u)*1);box-shadow:0 calc(var(--u)*.6) 0 rgba(74,44,34,.3);z-index:8;
  transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .25s}
#panel.off{transform:translateY(140%);opacity:0;pointer-events:none}
#ptag{position:absolute;left:calc(var(--u)*2.2);top:calc(var(--u)*-1.9);background:var(--coral);color:#fff;
  border:calc(var(--u)*.4) solid var(--ink);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*.1) calc(var(--u)*1.5);font-size:calc(var(--u)*2.2)}
#ptext.long{font-size:calc(var(--u)*2.8)}
#ptext{flex:1;min-width:0;font-size:calc(var(--u)*3.3);line-height:1.3;text-wrap:balance;word-break:keep-all}
#ptext small{display:block;font-size:.6em;color:var(--muted);margin-top:calc(var(--u)*.3)}
#ptext em{font-style:normal;color:var(--coral-d)}
#pbtn{flex:none;font:inherit;color:#fff;cursor:pointer;background:var(--coral);border:calc(var(--u)*.5) solid var(--ink);
  box-shadow:0 calc(var(--u)*.7) 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.8)}
#pbtn:active{transform:translateY(calc(var(--u)*.4));box-shadow:0 calc(var(--u)*.3) 0 var(--ink)}
#pbtn.mic{width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;padding:calc(var(--u)*1.8)}
#pbtn.next{border-radius:calc(var(--u)*4);padding:calc(var(--u)*1.2) calc(var(--u)*3);font-size:calc(var(--u)*3.2)}
#pbtn svg{width:100%;height:100%;display:block}
#pbtn.next svg{width:calc(var(--u)*3);height:calc(var(--u)*3)}
@keyframes hear{0%{box-shadow:0 0 0 0 rgba(95,181,127,.7),0 calc(var(--u)*.7) 0 var(--ink)}100%{box-shadow:0 0 0 calc(var(--u)*3.2) rgba(95,181,127,0),0 calc(var(--u)*.7) 0 var(--ink)}}
#pbtn.listening{background:var(--leaf);animation:hear 1s ease-out infinite}
button:focus-visible,input:focus-visible{outline:calc(var(--u)*.5) solid #2b7fd9;outline-offset:calc(var(--u)*.4)}

#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);opacity:0;background:var(--paper);
  border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*3);padding:calc(var(--u)*1.6) calc(var(--u)*3.6);
  font-size:calc(var(--u)*4.4);z-index:9;pointer-events:none;white-space:nowrap;display:flex;flex-direction:column;align-items:center;
  gap:calc(var(--u)*.3);box-shadow:0 calc(var(--u)*.8) 0 rgba(74,44,34,.3);transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#toast.on{transform:translate(-50%,-50%) scale(1);opacity:1}
#toast .big{font-size:1.5em;padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*2);color:#fff}

/* 트레이 준비 (위에서 본 그림) */
#prep{position:absolute;inset:0;z-index:7;background:rgba(46,33,29,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:2.5%;box-sizing:border-box;transition:opacity .3s}
#prep.off{opacity:0;pointer-events:none}
#prep .box{position:relative;width:64%;aspect-ratio:1000/600;background:#fbeedd;border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*3);
  box-shadow:0 calc(var(--u)*.8) 0 rgba(46,33,29,.5);overflow:hidden}
#prep svg{display:block;width:100%;height:100%;touch-action:none}
#prep .ttl{position:absolute;left:calc(var(--u)*2.4);top:calc(var(--u)*1.6);font-size:calc(var(--u)*3);background:var(--coral);color:#fff;
  border:calc(var(--u)*.4) solid var(--ink);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*.1) calc(var(--u)*1.6)}

/* 결과 */
#result{position:absolute;inset:0;z-index:10;background:rgba(46,33,29,.55);display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#result.off{opacity:0;pointer-events:none}
#result .card{width:70%;background:var(--paper);border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*3);
  padding:calc(var(--u)*2.2) calc(var(--u)*3.2);box-shadow:0 calc(var(--u)*.8) 0 rgba(46,33,29,.5);display:flex;flex-direction:column;gap:calc(var(--u)*1)}
#result h2{margin:0;font-weight:400;font-size:calc(var(--u)*4.4);text-align:center}
#rlist{display:flex;flex-direction:column;gap:calc(var(--u)*.6);font-size:calc(var(--u)*2.7)}
#rlist div{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*2);border-bottom:calc(var(--u)*.25) dashed #e1cdb4;padding-bottom:calc(var(--u)*.5)}
#rlist.two{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(var(--u)*3);font-size:calc(var(--u)*2.3)}
#rlist b{font-weight:400;padding:0 calc(var(--u)*1.2);border-radius:calc(var(--u)*1.4);color:#fff;white-space:nowrap}
#rbtns{display:flex;gap:calc(var(--u)*1.6);justify-content:center;margin-top:calc(var(--u)*.8)}
.cbtn{font:inherit;font-size:calc(var(--u)*3);color:#fff;background:var(--coral);border:calc(var(--u)*.45) solid var(--ink);border-radius:calc(var(--u)*4);
  padding:calc(var(--u)*.9) calc(var(--u)*3);box-shadow:0 calc(var(--u)*.6) 0 var(--ink);cursor:pointer}
.cbtn.sub{background:#fff;color:var(--ink)}
.cbtn:active{transform:translateY(calc(var(--u)*.4));box-shadow:0 calc(var(--u)*.2) 0 var(--ink)}

/* 첫 화면 */
#title{position:absolute;inset:0;z-index:20;background:#fbeedd;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*4);transition:opacity .4s}
#title.off{opacity:0;pointer-events:none}
#tleft{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2);width:38%}
#tleft svg{width:calc(var(--u)*15);height:calc(var(--u)*13)}
#title h1{margin:0;font-size:calc(var(--u)*4.6);font-weight:400;line-height:1.1;text-align:center;white-space:nowrap}
#title p{margin:0;font-size:calc(var(--u)*2.6);color:var(--muted);text-align:center}
.who{display:flex;gap:calc(var(--u)*1);width:100%}
.who label{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.3);font-size:calc(var(--u)*2.2);color:var(--muted);text-align:center}
.who label:first-child{width:34%}.who label:last-child{flex:1}
.who input{font:inherit;font-size:calc(var(--u)*3);color:var(--ink);background:#fff;border:calc(var(--u)*.4) solid var(--ink);border-radius:calc(var(--u)*1.6);
  padding:calc(var(--u)*.6) calc(var(--u)*1.2);width:100%;box-sizing:border-box;min-width:0;text-align:center}
#chap{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.2);width:44%}
.ch{font:inherit;text-align:left;display:flex;flex-direction:column;gap:calc(var(--u)*.2);background:#fff;color:var(--ink);border:calc(var(--u)*.45) solid var(--ink);
  border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.2) calc(var(--u)*1.6);box-shadow:0 calc(var(--u)*.6) 0 var(--ink);cursor:pointer;font-size:calc(var(--u)*3)}
.ch small{font-size:.66em;color:var(--muted);word-break:keep-all}
.ch.on{background:var(--coral);color:#fff}.ch.on small{color:#fff}
.ch:disabled{opacity:.5;cursor:default;box-shadow:none}
.ch.big{grid-column:span 2;align-items:center;text-align:center;font-size:calc(var(--u)*4.4);padding:calc(var(--u)*1.8) calc(var(--u)*1.6);background:var(--butter)}
.ch.big small{font-size:.5em}
@media (prefers-reduced-motion:reduce){.bob,.pickme,.blink{animation:none}.layer{transition:none}}
</style>

<p id="tip">휴대폰을 가로로 돌리면 크게 보여요</p>
<div id="stage">

<!-- ===================== 심사위원 장면 ===================== -->
<div class="layer" id="Ljudge">
<svg id="judge" viewBox="0 0 1600 900" aria-hidden="true">
<defs>
  <pattern id="pDotJ" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="4" fill="#cfe2d0"/><circle cx="60" cy="60" r="4" fill="#cfe2d0"/></pattern>
</defs>
<rect width="1600" height="900" fill="#e4f0e4"/>
<rect width="1600" height="560" fill="url(#pDotJ)"/>
<rect y="420" width="1600" height="160" fill="#cfe3d1"/><path d="M0 420H1600" class="o3 nf" opacity=".4"/>
<!-- 현수막 -->
<g transform="translate(1060 74)">
  <path d="M-230 -46H230L214 0L230 46H-230L-214 0Z" fill="#ff8a73" class="o"/>
  <path d="M-200 -33H200" stroke="#fff" stroke-width="5" opacity=".35" stroke-linecap="round"/>
  <text y="14" text-anchor="middle" font-size="44" fill="#fff">2급 실기 평가</text>
  <path d="M-250 -96V-46M250 -96V-46" class="o3 nf"/>
</g>

<g transform="translate(1440 230)"><circle r="62" fill="#fff" class="o"/><circle r="50" fill="#fffaf0"/>
  <path d="M0 -38V-30M0 30V38M-38 0H-30M30 0H38" class="o3 nf"/><path d="M0 0V-30M0 0L22 10" class="o4 nf"/><circle r="6" fill="#4a2c22"/></g>
<!-- 화분 -->
<g transform="translate(150 560)"><path d="M0 -70Q-60 -110 -50 -190Q-10 -150 0 -70Z" fill="#6fbf8b" class="o4"/><path d="M0 -70Q60 -120 52 -200Q8 -150 0 -70Z" fill="#8fd3a3" class="o4"/><path d="M0 -70Q-10 -160 6 -230Q36 -150 0 -70Z" fill="#5aa878" class="o4"/>
  <path d="M-48 -80H48L36 0H-36Z" fill="#e0764f" class="o"/><rect x="-54" y="-92" width="108" height="18" rx="7" fill="#ee8d68" class="o4"/></g>

<!-- 심사 탁자 -->
<path d="M120 572H1480L1500 600H100Z" fill="#fffdf8" class="o"/>

</svg>
</div>

<!-- ===================== 바(제조대) 장면 ===================== -->
<div class="layer" id="Lbar">
<svg id="station" viewBox="0 0 1600 900" aria-hidden="true">
<defs>
  <linearGradient id="gChrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fafb"/><stop offset=".5" stop-color="#d3dce1"/><stop offset="1" stop-color="#a7b5be"/></linearGradient>
  <linearGradient id="gChromeH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#aebbc4"/><stop offset=".3" stop-color="#f5f8f9"/><stop offset=".65" stop-color="#cdd7dd"/><stop offset="1" stop-color="#98a7b1"/></linearGradient>
  <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9d3d9"/><stop offset=".22" stop-color="#f4f7f8"/><stop offset=".5" stop-color="#bcc8cf"/><stop offset=".78" stop-color="#eef2f4"/><stop offset="1" stop-color="#a9b6be"/></linearGradient>
  <pattern id="pTile" width="104" height="116" patternUnits="userSpaceOnUse"><rect width="104" height="116" fill="#e9f3ea"/><path d="M0 1.5H104M0 59.5H104M1.5 0V58M53.5 58V116" stroke="#c9ddc8" stroke-width="3" fill="none"/></pattern>
  <pattern id="pGrill" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#8f9ca5"/><rect x="2" y="2" width="12" height="12" rx="2" fill="#5d6a73"/></pattern>
</defs>
<!-- 벽, 조리대 -->
<rect width="1600" height="900" fill="#d9eadb"/>
<rect y="250" width="1600" height="330" fill="url(#pTile)"/>
<rect y="236" width="1600" height="16" fill="#fff7ea" class="o3"/>

<script>
(()=>{'use strict';
/* ================= 기본 도구 ================= */
const $=(s,r=document)=>r.querySelector(s),NS='http://www.w3.org/2000/svg';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const E={lin:t=>t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),
  back:t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  spring:t=>1-Math.cos(t*Math.PI*3.2)*Math.exp(-t*5.5)};
function anim(ms,fn,e=E.io){return new Promise(res=>{const t0=performance.now();const f=now=>{const p=clamp((now-t0)/ms,0,1);fn(p<1?e(p):1,p);p<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)})}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16),c=s=>Math.round(lerp(pa>>s&255,pb>>s&255,t));return '#'+((1<<24)+(c(16)<<16)+(c(8)<<8)+c(0)).toString(16).slice(1)}
class Sp{
  constructor(els,x=0,y=0){this.els=[].concat(els);this.x=x;this.y=y;this.r=0;this.sx=1;this.sy=1;this.set()}
  set(o){if(o)Object.assign(this,o);const t=`translate(${this.x.toFixed(1)} ${this.y.toFixed(1)}) rotate(${this.r.toFixed(2)}) scale(${this.sx.toFixed(3)} ${this.sy.toFixed(3)})`;for(const e of this.els)e.setAttribute('transform',t);return this}
  to(o,ms=400,e=E.io){const s={};for(const k in o)s[k]=this[k];return anim(ms,t=>{for(const k in o)this[k]=lerp(s[k],o[k],t);this.set()},e)}
  async hop(x,y,ms=520,h=70,sq=.12){const x0=this.x,y0=this.y;await anim(ms,(t,p)=>{this.x=lerp(x0,x,t);this.y=lerp(y0,y,t)-Math.sin(Math.PI*p)*h;this.set()},E.io);if(sq)await this.squash(sq)}
  async squash(a=.12){await this.to({sx:1+a,sy:1-a},80,E.out);await this.to({sx:1,sy:1},300,E.spring)}
}

  const W=b.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=b.clientHeight-(tip.offsetHeight?tip.offsetHeight+8:0);
  const w=Math.max(240,Math.min(W,H*16/9));stage.style.width=w+'px';stage.style.height=(w*9/16)+'px';stage.style.setProperty('--u',(w/100)+'px')}
addEventListener('resize',fit);fit();

/* ================= 아이콘 ================= */
const starP='M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z';

function holdLoop(el,onDown,onTick,onUp){return new Promise(res=>{let down=false,last=0,done=false;
  const dn=e=>{if(done)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}down=true;last=performance.now();Guide.pause();onDown&&onDown()};
  const up=async()=>{if(!down)return;down=false;const r=await onUp();if(r){done=true;off();res(r)}else Guide.resume()};
  const ctx=e=>e.preventDefault();
  const off=()=>{el.removeEventListener('pointerdown',dn);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.removeEventListener('lostpointercapture',up);el.removeEventListener('contextmenu',ctx)};
  el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);el.addEventListener('contextmenu',ctx);
  const f=now=>{if(done)return;if(down){const dt=(now-last)/1000;last=now;const r=onTick(dt);if(r==='stop'){down=false;Promise.resolve(onUp()).then(x=>{if(x){done=true;off();res(x)}else Guide.resume()})}}requestAnimationFrame(f)};requestAnimationFrame(f)})}

  const mv=e=>{if(!g||done)return;const p=spt(e),d=Math.hypot(p.x-g.lx,p.y-g.ly),vx=p.x-g.lx;g.lx=p.x;g.ly=p.y;

  async function fin(){off();zone();Guide.stop();T.clear();sparkle(o.x,o.y-20,6);SFX.ok();floatText(o.x,o.y-50,o.done||'깨끗!');
